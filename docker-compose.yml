# PULSE — local stack.
#
# NOTE: Docker was not available on the machine this project was developed on,
# so this compose file is provided for completeness and reviewed by eye — it has
# not been executed end-to-end. The app runs without Docker (see README).

services:
  # Provisioned for the SQLAlchemy path described in backend/app/db/models.py.
  # The API does NOT connect to it today — persistence is the JSON store below.
  # It is kept so the migration has somewhere to land, not because it is used.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
      POSTGRES_DB: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://pulse:pulse@db:5432/pulse
      CORS_ORIGINS: http://localhost:3000
      # Where user systems and accounts are written. On a named volume, so
      # rebuilding the image does not wipe what people created.
      PULSE_DATA_DIR: /data
      # Override this. The default is a published development value, and any
      # session token signed with it can be forged by anyone reading the source.
      SECRET_KEY: ${SECRET_KEY:-pulse-dev-secret-not-for-production}
    volumes:
      - pulse_workspace:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pulse_pgdata:
  pulse_workspace:
